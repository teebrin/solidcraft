name: Offset 3290 Linux diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Linux offset reference
        working-directory: solidcore
        run: cargo run --profile goldens -p goldens -- --unit curve.composite_curve_p2 --goldens
