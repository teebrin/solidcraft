name: Offset 3290 final targeted checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: solidcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Format
        run: cargo fmt --all --check
      - name: Panic inventory
        run: python3 -I scripts/ci/check_panic_sites.py
      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Offset regression tests
        run: cargo test -p solidcore --test issue_3290_offset
      - name: WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p solidcore --target wasm32-unknown-unknown
